version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. Reverse Proxy & Automatic SSL Termination (Caddy 2)
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: asn-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - asn-network
    depends_on:
      - api-server
      - buyer-web
      - supplier-web
      - admin-web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # 2. Database: PostgreSQL 16 with PostGIS 3.4
  # ---------------------------------------------------------------------------
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: asn-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-asn_prod}
      POSTGRES_USER: ${DB_USER:-asn_prod_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be provided}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - asn-network
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-asn_prod_user} -d ${DB_NAME:-asn_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2048M
        reservations:
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # 3. Cache & Lock Coordination: Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: asn-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be provided}"]
    volumes:
      - redis_prod_data:/data
    networks:
      - asn-network
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 4. Core Backend: NestJS Modular Monolith API
  # ---------------------------------------------------------------------------
  api-server:
    build:
      context: .
      dockerfile: apps/api-server/Dockerfile
    container_name: asn-api-server-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public&sslmode=prefer
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET must be set}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://asn.in,https://buyer.asn.in,https://supplier.asn.in,https://admin.asn.in}
      ALLOW_DEV_OTP: "false"
    networks:
      - asn-network
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # ---------------------------------------------------------------------------
  # 5. Frontend: Buyer Web Portal
  # ---------------------------------------------------------------------------
  buyer-web:
    build:
      context: .
      dockerfile: apps/buyer-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.asn.in/api/v1}
    container_name: asn-buyer-web-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - asn-network
    expose:
      - "3000"
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 6. Frontend: Supplier OS Portal
  # ---------------------------------------------------------------------------
  supplier-web:
    build:
      context: .
      dockerfile: apps/supplier-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.asn.in/api/v1}
    container_name: asn-supplier-web-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
    networks:
      - asn-network
    expose:
      - "3001"
    deploy:
      resources:
        limits:
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 7. Frontend: Admin Governance Control Centre
  # ---------------------------------------------------------------------------
  admin-web:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.asn.in/api/v1}
    container_name: asn-admin-web-prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3002
    networks:
      - asn-network
    expose:
      - "3002"
    deploy:
      resources:
        limits:
          memory: 768M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# -----------------------------------------------------------------------------
# Networks & Persistent Volumes
# -----------------------------------------------------------------------------
networks:
  asn-network:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local

